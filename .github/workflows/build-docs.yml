name: Build Sphinx docs and deploy to GitHub Pages

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build docs (local target)
        # README instructs to use `make local` to build the HTML manual.
        run: |
          make local
        env:
          # Optional: If you want the contributor sidebar pages populated (slower),
          # set a token in the repo secrets named GH_TOKEN and uncomment the line below.
          # GH_TOKEN: ${{ secrets.GH_TOKEN }}

      - name: Upload generated docs artifact (for debugging)
        uses: actions/upload-artifact@v4
        with:
          name: docs-html
          path: build/manual/build/html

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          deploy_key: ${{ secrets.ACTIONS_DEPLOY_KEY }}   # OR use personal access token below
          # If you prefer to use GITHUB_TOKEN:
          # github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: build/manual/build/html
          # target_branch: gh-pages   # default is gh-pages
